<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#25064f" />
    <meta name="description" content="Sitio oficial de Solares, el Torito Violeta." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Solares</title>

    <!--
      Social cards are read by crawlers that never run JavaScript, so these tags
      cannot come from React Helmet: they must exist in the served HTML. Helmet
      still overrides them per page for anything that does execute the app.
      The image URL must be absolute — a relative path is ignored.
    -->
    <meta property="og:site_name" content="Solares" />
    <meta property="og:title" content="Solares" />
    <meta property="og:description" content="Sitio oficial de Solares, el Torito Violeta." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:url" content="https://solaresfutbol.com/" />
    <meta property="og:image" content="https://solaresfutbol.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Escudo de Solares, el Torito Violeta" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Solares" />
    <meta name="twitter:description" content="Sitio oficial de Solares, el Torito Violeta." />
    <meta name="twitter:image" content="https://solaresfutbol.com/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
